[workspace]
members = [
    "crates/dyl-core",
    "crates/dyl-ffmpeg",
    "crates/dyl-render",
    "crates/dyl-audio",
    "crates/dyl-danmaku",
    "crates/dyl-subtitle",
    "crates/dyl-pipeline",
    "crates/dyl-engine",
    "crates/dyl-ffi",
    "crates/dyl-player",
]
resolver = "2"

[workspace.dependencies]
# LTS locked
ffmpeg-next = { version = "8.1", default-features = false, features = ["codec", "format", "filter", "software-scaling", "software-resampling"] }
# `std` and `parking_lot` were being dropped by default-features = false, which
# left wgpu-core building in no_std mode -- fine for a Windows check, broken for
# the Android Vulkan/GLES backends.
#
# `dx12` requires every crate exposing Windows D3D types to agree on one `windows`
# version. gpu-allocator 0.28 accepts `>=0.53, <=0.62`, so the resolver can pair it
# with cpal's old 0.54 pin while wgpu-hal uses 0.62 -- and ID3D12Heap from two
# `windows` crates does not satisfy the same `Param` bound. cpal >= 0.18 depends on
# `windows ^0.62`, which keeps that edge unified; do not downgrade cpal below 0.18
# without re-checking `cargo tree -i windows`.
wgpu = { version = "29", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "gles", "wgsl", "dx12"] }
# 0.18 (not 0.15) because `dx12` needs one `windows` version across the graph; see
# the wgpu feature note above. API delta: config passed by value, `DeviceTrait::description`.
cpal = "0.18"
crossbeam-channel = "0.5"

# Common
bytemuck = { version = "1", features = ["derive"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# winit is shell-only (dyl-player + cli_player). android-native-activity is
# still enabled because those examples must compile for Android; the plugin
# itself gets its surface from Flutter via ExternalRenderer.
# (Still named `android-native-activity` on winit 0.30 — the rename to
# `android-activity` happens in 0.31, which is still beta.)
winit = { version = "0.30", features = ["android-native-activity"] }
# egui 0.35 is the last line matching wgpu 29; 0.36 moves to wgpu 30.
# `default-features = false` is mandatory: egui-wgpu's defaults include
# `wgpu/default`, which would silently turn dx12/dx11/webgl back on.
egui = { version = "~0.35", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "~0.35", default-features = false }
egui-winit = { version = "~0.35", default-features = false, features = ["clipboard", "links"] }
pollster = "0.4"
thiserror = "1"
aho-corasick = "1.1"
regex = "1"
