# cbindgen configuration for dyl-ffi
language = "C"
include_guard = "DYL_H"
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Do not modify. */"
cpp_compat = true

header = """/* dyl.h - Dyl Player C FFI Header
 *
 * Usage:
 *   - Dart/Flutter: use dart:ffi to look up these symbols
 *   - C/C++: link against dyl (libdyl.so / dyl.dll) and include this header
 */"""

# 依赖 dyl-ffi 自身的源码，不解析依赖 crate 的公开项
[parse]
parse_deps = false

[export]
include = [
    # 回调类型别名必须显式导出，否则使用它们的函数只能得到
    # Option_XxxCallback 这种不透明 struct，C 侧无法声明回调
    "DylEventCallback",
    "DylHandle",
    "DYL_ABI_VERSION_MAJOR",
    "DYL_ABI_VERSION_MINOR",
    "DYL_ABI_VERSION_PATCH",
    "DYL_ABI_VERSION",
    "DYL_OK",
    "DYL_ERR_INVALID_ARGUMENT",
    "DYL_ERR_INVALID_STATE",
    "DYL_ERR_FILE_NOT_FOUND",
    "DYL_ERR_DEMUX",
    "DYL_ERR_DECODE",
    "DYL_ERR_RENDER",
    "DYL_ERR_AUDIO",
    "DYL_ERR_PIPELINE",
    "DYL_ERR_NOT_SUPPORTED",
    "DYL_ERR_SURFACE",
    "DYL_ERR_BUSY",
    "DYL_ERR_TIMEOUT",
    "DYL_ERR_IO",
    "DYL_ERR_CANCELLED",
    "DYL_ERR_INTERNAL",
    "dyl_abi_version",
    "dyl_capabilities",
    "dyl_create",
    "dyl_destroy",
    "dyl_command",
    "dyl_get_snapshot",
    "dyl_get_property",
    "dyl_surface_attach",
    "dyl_surface_detach",
    "dyl_surface_resize",
    "dyl_surface_redraw",
    "dyl_set_event_callback",
    "dyl_poll_event",
    "dyl_free_string",
    "dyl_last_error",
    "dyl_error_string"
]

[enum]
rename_variants = "ScreamingSnakeCase"
